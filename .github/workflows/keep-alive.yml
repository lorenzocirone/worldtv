name: Keep Render Service Alive
on:
  schedule:
    # Ogni 10 minuti, ma non allo scoccare dell'ora
    - cron: "5,10,15,20,25,30,35,40,45,50,55 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          curl -f --max-time 30 https://tils-4vse.onrender.com/